name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANALYTICS_COMMIT: b7f81f7da106229dfa9112b8851788b69f46b88e

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Activate exact npm
        run: |
          corepack enable npm
          corepack prepare npm@11.12.1 --activate
          npm --version
      - name: Verify committed product identity and artifact
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('analytics-source.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const relativeTarball = `vendor/${manifest.tarball}`;
          const entry = lock.packages?.['node_modules/@codeworkslabs/astro-analytics'];
          const artifact = readFileSync(relativeTarball);
          const sha256 = createHash('sha256').update(artifact).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(artifact).digest('base64')}`;

          if (
            manifest.repository !== 'CodeWorksLabs/astro-analytics' ||
            manifest.ref !== process.env.ANALYTICS_COMMIT ||
            manifest.commit !== process.env.ANALYTICS_COMMIT ||
            sha256 !== manifest.sha256 ||
            integrity !== manifest.integrity ||
            entry?.version !== manifest.version ||
            entry?.resolved !== `file:${relativeTarball}` ||
            entry?.integrity !== integrity
          ) {
            throw new Error('The committed analytics artifact does not match its declared source and lock identities.');
          }
          NODE
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run deploy:dry-run
