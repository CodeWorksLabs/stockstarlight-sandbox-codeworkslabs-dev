name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANALYTICS_REF: v0.1.0-alpha.8
  ANALYTICS_COMMIT: f480c3ce152c49637efcfea6dc38c7577fa28d82
  ANALYTICS_TARBALL: codeworkslabs-astro-analytics-0.1.0-alpha.8.tgz

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify declared product source identity
        run: node -e "const m=require('./analytics-source.json'); if(m.ref!==process.env.ANALYTICS_REF||m.commit!==process.env.ANALYTICS_COMMIT||m.tarball!==process.env.ANALYTICS_TARBALL) process.exit(1)"
      - name: Check out public product source
        uses: actions/checkout@v7
        with:
          repository: CodeWorksLabs/astro-analytics
          ref: ${{ env.ANALYTICS_REF }}
          path: .analytics-source
          persist-credentials: false
      - name: Verify resolved public product commit
        working-directory: .analytics-source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ANALYTICS_COMMIT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.12.1
      - name: Pack exact public product candidate
        working-directory: .analytics-source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor"
          npm pack --pack-destination "$GITHUB_WORKSPACE/vendor"
      - name: Verify public product artifact exists
        shell: bash
        run: test -f "vendor/$ANALYTICS_TARBALL"
      - name: Bind lock integrity to runner-produced artifact
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('analytics-source.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const relativeTarball = `vendor/${process.env.ANALYTICS_TARBALL}`;
          const entry = lock.packages?.['node_modules/@codeworkslabs/astro-analytics'];

          if (
            manifest.tarball !== process.env.ANALYTICS_TARBALL ||
            entry?.version !== manifest.version ||
            entry?.resolved !== `file:${relativeTarball}`
          ) {
            throw new Error('The analytics package-lock entry does not match the declared source.');
          }

          entry.integrity = `sha512-${createHash('sha512')
            .update(readFileSync(relativeTarball))
            .digest('base64')}`;
          writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run deploy:dry-run
